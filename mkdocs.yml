site_name: Asia知识库
site_description: 面向持续学习与查阅的个人技术知识库
site_url: !ENV [SITE_URL, ""]
repo_url: !ENV [REPO_URL, ""]
repo_name: GitHub
edit_uri: !ENV [EDIT_URI, ""]

theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: assets/favicon.svg
  icon:
    logo: material/notebook-outline
  font: false
  palette:
    scheme: slate
    primary: indigo
    accent: light-blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

hooks:
  - hooks/domain_navigation.py

nav:
  - 首页: index.md
  - 软件测试:
      - 领域总览: software-testing/index.md
      - 01 测试基础与生命周期: software-testing/01-foundations.md
      - 02 测试分析、设计与准备: software-testing/02-analysis-and-design.md
      - 03 测试执行与质量管理: software-testing/03-execution-and-quality.md
      - 04 应用、接口与业务测试: software-testing/04-application-testing.md
      - 05 质量属性与专项测试: software-testing/05-quality-attributes.md
      - 06 自动化与测试工程: software-testing/06-automation-and-engineering.md
      - 07 测试能力与实践方法: software-testing/07-practice-handbook.md
  - 接口自动化:
      - 领域总览: pytest-api-automation/index.md
      - 01 框架设计与项目结构: pytest-api-automation/01-framework-design-and-structure.md
      - 02 项目基础与配置管理: pytest-api-automation/02-foundation-and-configuration.md
      - 03 HTTP 请求与 API Object: pytest-api-automation/03-http-and-api-object.md
      - 04 日志与失败诊断: pytest-api-automation/04-logging-and-diagnostics.md
      - 05 pytest 编排与状态管理: pytest-api-automation/05-pytest-orchestration-and-state.md
      - 06 数据驱动、断言与测试实现: pytest-api-automation/06-data-driven-assertions-and-tests.md
      - 07 测试设计与工程化边界: pytest-api-automation/07-test-design-and-engineering.md
      - 08 运行、排障与验收: pytest-api-automation/08-commands-troubleshooting-and-review.md
  - 工作资源与技巧:
      - 领域总览: work-resources-and-tips/index.md
      - 01 常用网站与在线工具: work-resources-and-tips/01-useful-websites.md
      - 02 常用命令与测试方法: work-resources-and-tips/02-practical-tips.md
  - 测试工程师面试:
      - 领域总览: test-engineer-interview/index.md
      - 01 理论基础与测试流程: test-engineer-interview/01-theory-foundations.md
      - 02 项目经验: test-engineer-interview/02-project-experience.md
      - 03 场景分析与业务测试: test-engineer-interview/03-scenario-analysis.md
      - 04 职业认知与人工智能: test-engineer-interview/04-career-and-ai.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
      toc_depth: 3

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

strict: true
use_directory_urls: true

extra_css:
  - assets/stylesheets/extra.css
